name: macOS ESP-IDF firmware integration

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/App.tsx'
      - 'src/ToolchainSetup.tsx'
      - '.github/workflows/macos-idf-smoke.yml'

permissions:
  contents: read

jobs:
  firmware:
    name: Native ESP-IDF (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Verify actual runner architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Repair launcher syntax
        run: bash -n scripts/repair-macos-idf.command
      - name: Frontend checks
        run: |
          npm ci
          npx tsc --noEmit
          npm test
      - name: Rust tests (including installer cancellation tree)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Native installation and real firmware builds
        env:
          VIBEKIDBRIGHT_BOOTSTRAP_PYTHON: ${{ env.pythonLocation }}/bin/python3
        run: |
          cargo run --locked --manifest-path src-tauri/Cargo.toml --example macos-idf-smoke -- "$HOME/.vibekidbright/toolchain" "$RUNNER_TEMP/vibe-idf-firmware-check"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-idf-${{ matrix.arch }}-verification
          path: |
            ${{ runner.temp }}/vibe-idf-firmware-check/verification.json
            ${{ runner.temp }}/vibe-idf-firmware-check/**/build/*.bin
            ${{ runner.temp }}/vibe-idf-firmware-check/**/build/log/**
          if-no-files-found: ignore
