sentence=Micromouse teaching platform — L0-L2 (HAL + motion/sensing primitives) behind one simple class.
paragraph=Students write only their single .ino (L3 maze logic) and call moveCell(), turn90(), wallFront() and friends. The 500Hz FF+PD control loop, trapezoidal profiles, gyro spins, wall-centering steering, front-wall correction and BLE tuning are hidden in proven modules. Sensing is exposed as binary (wall?) + mm, so swapping Sharp IR for pulsed-IR is an L0-only change. Targets ESP32-S3 (DRV8833 + Sharp IR rig); ports to the competition PCB by editing config.h pins only.
